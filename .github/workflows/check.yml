name: check-postings

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [check-postings]
  schedule:
    - cron: "0 * * * *"  # 안전망: cron-job.org가 죽어도 최소 1시간마다는 돈다

permissions:
  contents: write

concurrency:
  group: kicpa-scraper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 기본값은 run 생성 시점의 커밋(GITHUB_SHA)이라, concurrency 대기 중 앞 회차가
          # state.json을 push하면 낡은 state로 돌게 되고 push 시 rebase 충돌로 실패한다.
          # 브랜치명을 주면 체크아웃 시점의 최신 커밋을 가져온다.
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Commit updated state
        run: |
          git config user.name "kicpa-job-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "no state change"
            exit 0
          fi
          git commit -m "update state [skip ci]"
          # 1분 간격으로 도는데 한 회차가 1분을 넘길 때가 있어, 앞 회차가 먼저 push하면
          # 이 회차는 낡은 커밋 기준이라 거부된다(non-fast-forward). rebase 후 재시도한다.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected; rebasing and retrying ($attempt/5)"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "push failed after 5 attempts"
          exit 1
